[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-player-stat-predictor"
version = "0.1.0"
description = "Leakage-safe NBA player box-score predictions"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "nba_api>=1.4,<2",
  "streamlit>=1.40,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
